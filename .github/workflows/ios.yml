name: iOS build

on:
  # Branch work builds through its pull request; pushing to main builds main.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      screenshots:
        description: Take simulator screenshots and commit them to docs/screenshots
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Build for simulator
        run: |
          xcodebuild \
            -project Orbit.xcodeproj \
            -target Orbit \
            -sdk iphonesimulator \
            -configuration Debug \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            build > ios-build.log 2>&1 || true
          grep -E "error:|warning: .*(Orbit|Shared)/|BUILD (SUCCEEDED|FAILED)" ios-build.log || true
          grep -q "BUILD SUCCEEDED" ios-build.log
      - name: Build watch app
        run: |
          xcodebuild \
            -project Orbit.xcodeproj \
            -target OrbitWatch \
            -sdk watchsimulator \
            -configuration Debug \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            build > watch-build.log 2>&1 || true
          grep -E "error:|warning: .*(OrbitWatch|Shared)/|BUILD (SUCCEEDED|FAILED)" watch-build.log || true
          grep -q "BUILD SUCCEEDED" watch-build.log
      - name: Build widgets
        run: |
          xcodebuild \
            -project Orbit.xcodeproj \
            -target OrbitWidgets \
            -sdk iphonesimulator \
            -configuration Debug \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            build > widgets-build.log 2>&1 || true
          grep -E "error:|warning: .*(OrbitWidgets|WidgetShared)/|BUILD (SUCCEEDED|FAILED)" widgets-build.log || true
          grep -q "BUILD SUCCEEDED" widgets-build.log
      - name: Feed parser check
        continue-on-error: true
        timeout-minutes: 5
        run: |
          swiftc -O Orbit/Services/FeedParser.swift Orbit/Services/OPML.swift Orbit/Services/Chapters.swift tools/feedcheck/main.swift -o /tmp/feedcheck
          /tmp/feedcheck tools/feedcheck/overcast-sample.opml
      - name: Screenshots
        if: github.event_name == 'workflow_dispatch' && inputs.screenshots
        timeout-minutes: 18
        run: |
          set -x
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          phones=[x for r in d if "iOS" in r for x in d[r] if x["name"].startswith("iPhone")]
          pro=[x for x in phones if "Pro" in x["name"] and "Max" not in x["name"]]
          print((pro or phones)[-1]["udid"])')
          echo "Using $UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryLevel 100 --cellularBars 4
          xcrun simctl install "$UDID" build/Debug-iphonesimulator/Orbit.app
          mkdir -p docs/screenshots
          cd docs/screenshots
          shoot() {
            xcrun simctl terminate "$UDID" com.tomlandy.Orbit 2>/dev/null || true
            xcrun simctl launch "$UDID" com.tomlandy.Orbit -demo "$@"
            sleep 6
            xcrun simctl io "$UDID" screenshot "$NAME.png"
          }
          NAME=1-latest shoot -demoTab latest
          NAME=2-library shoot -demoTab library
          NAME=3-player shoot -demoTab latest -demoPlayer YES
          NAME=4-search shoot -demoTab search
          NAME=5-settings shoot -demoTab latest -demoSettings YES -accentTheme teal
          NAME=6-player-violet shoot -demoTab latest -demoPlayer YES -accentTheme violet
          NAME=7-library-blue shoot -demoTab library -accentTheme blue
          NAME=8-import shoot -demoTab latest -demoImport YES
          NAME=9-upnext shoot -demoTab latest -demoPlayer YES -demoUpNext YES
          NAME=10-chapters shoot -demoTab latest -demoPlayer YES -demoChapters YES
          NAME=11-stats shoot -demoTab library -demoStats YES
          NAME=12-widgets shoot -demoTab latest -demoWidgets YES
          xcrun simctl terminate "$UDID" com.tomlandy.Orbit || true
          xcrun simctl launch "$UDID" com.tomlandy.Orbit
          sleep 5
          xcrun simctl io "$UDID" screenshot 0-empty.png
          sips --resampleWidth 590 *.png >/dev/null
          # Watch: sample data, list page and now playing page
          WATCH=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          w=[x for r in d if "watchOS" in r for x in d[r] if "Apple Watch" in x["name"]]
          print(w[-1]["udid"] if w else "")')
          if [ -n "$WATCH" ]; then
            xcrun simctl bootstatus "$WATCH" -b
            xcrun simctl install "$WATCH" "../../build/Debug-watchsimulator/Orbit Watch.app"
            xcrun simctl launch "$WATCH" com.tomlandy.Orbit.watchkitapp -demo -demoPage 1
            sleep 8
            xcrun simctl io "$WATCH" screenshot watch-1-latest.png
            xcrun simctl terminate "$WATCH" com.tomlandy.Orbit.watchkitapp || true
            xcrun simctl launch "$WATCH" com.tomlandy.Orbit.watchkitapp -demo -demoPage 2
            sleep 6
            xcrun simctl io "$WATCH" screenshot watch-2-downloaded.png
          fi
      - name: Commit screenshots
        if: github.event_name == 'workflow_dispatch' && inputs.screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git commit -m "Update screenshots [skip ci]" || exit 0
          git push
