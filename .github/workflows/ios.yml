name: iOS build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      screenshots:
        description: Take simulator screenshots and commit them to docs/screenshots
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project Warhound.xcodeproj \
            -target Warhound \
            -sdk iphonesimulator \
            -configuration Debug \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            build | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Debug-iphonesimulator/Warhound.app
      - name: Screenshots
        if: github.event_name == 'workflow_dispatch' && inputs.screenshots
        timeout-minutes: 12
        run: |
          set -x
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          phones=[x for r in d if "iOS" in r for x in d[r] if x["name"].startswith("iPhone")]
          pro=[x for x in phones if "Pro" in x["name"] and "Max" not in x["name"]]
          print((pro or phones)[-1]["udid"])')
          echo "Using $UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryLevel 100 --cellularBars 4
          xcrun simctl install "$UDID" build/Debug-iphonesimulator/Warhound.app
          mkdir -p docs/screenshots
          cd docs/screenshots
          shoot() {
            xcrun simctl terminate "$UDID" com.tomlandy.Warhound 2>/dev/null || true
            xcrun simctl launch "$UDID" com.tomlandy.Warhound -demo "$@"
            sleep 6
            xcrun simctl io "$UDID" screenshot "$NAME.png"
          }
          NAME=1-latest shoot -demoTab latest
          NAME=2-library shoot -demoTab library
          NAME=3-player shoot -demoTab latest -demoPlayer YES
          NAME=4-search shoot -demoTab search
          xcrun simctl terminate "$UDID" com.tomlandy.Warhound || true
          xcrun simctl launch "$UDID" com.tomlandy.Warhound
          sleep 5
          xcrun simctl io "$UDID" screenshot 0-empty.png
          sips --resampleWidth 590 *.png >/dev/null
      - name: Commit screenshots
        if: github.event_name == 'workflow_dispatch' && inputs.screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git commit -m "Update screenshots [skip ci]" || exit 0
          git push
